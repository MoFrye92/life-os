
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121312">

  <title>What's to Eat? | MO OS</title>

  <link rel="stylesheet" href="../css/food.css">

  <script src="../js/food-data.js" defer></script>
  <script src="../js/food.js" defer></script>
</head>

<body>

  <main class="food-app">

    <!-- HEADER -->
    <header class="food-header">
      <a href="../index.html" class="back-link">
        ← MO OS
      </a>

      <span class="wordmark">MO OS.</span>
    </header>


    <!-- INTRODUCTION -->
    <section class="food-hero">

      <p class="eyebrow">MO'S KITCHEN</p>

      <h1>What's to Eat<span class="accent">?</span></h1>

      <p class="hero-description">
        Everything on the menu is something
        we can make at home.
      </p>

    </section>


    <!-- MEAL CATEGORIES -->
    <nav class="meal-tabs" aria-label="Meal category">

      <button
        class="meal-tab is-active"
        data-category="breakfast"
        aria-pressed="true"
        type="button"
      >
        🍳 Breakfast
      </button>

      <button
        class="meal-tab"
        data-category="lunch"
        aria-pressed="false"
        type="button"
      >
        🥪 Lunch
      </button>

      <button
        class="meal-tab"
        data-category="dinner"
        aria-pressed="false"
        type="button"
      >
        🍝 Dinner
      </button>

    </nav>


    <!-- MENU HEADING + FILTER -->
    <section class="menu-section">

      <div class="menu-heading">
        <div>
          <p class="eyebrow">THIS WEEK'S LINEUP</p>

          <h2 id="meal-heading">
            Breakfast Menu
          </h2>
        </div>

        <span id="meal-count" class="meal-count">
          0 choices
        </span>
      </div>


      <div class="filter-bar">
        <label for="time-filter">
          ⏱️ Cooking time
        </label>

        <select id="time-filter">
          <option value="0">Any time</option>
          <option value="15">15 minutes or less</option>
          <option value="30">30 minutes or less</option>
          <option value="60">1 hour or less</option>
        </select>
      </div>


      <!-- FOOD CARDS GENERATED BY JAVASCRIPT -->
      <div id="food-grid" class="food-grid"></div>

    </section>


    <!-- FOOTER -->
    <footer class="food-footer">
      Made at home. Picked by Mo. 🍴
    </footer>

  </main>


  <!-- RECIPE DETAILS -->
  <dialog
    id="recipe-dialog"
    class="recipe-dialog"
    aria-labelledby="recipe-title"
  >

    <button
      id="close-recipe"
      class="close-recipe"
      type="button"
      aria-label="Close recipe"
    >
      ✕
    </button>

    <div id="recipe-content"></div>

  </dialog>

</body>
</html>
